name: Publish proof atlas to Pages

on:
  push:
    branches: [main]
    paths:
      - rule30-proof-atlas/index.html
      - rule30-proof-atlas/atlas-data.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add .nojekyll
        run: touch rule30-proof-atlas/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rule30-proof-atlas
      - id: deployment
        uses: actions/deploy-pages@v4
